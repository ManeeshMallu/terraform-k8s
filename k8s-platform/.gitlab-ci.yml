stages:
  - validate
  - plan
  - apply
  - install-argocd

variables:
  TF_ROOT: k8s-platform
  AWS_DEFAULT_REGION: us-east-1

before_script:
  - cd $TF_ROOT
  - terraform init

validate:
  stage: validate
  image: 
    name: hashicorp/terraform:1.10
    entrypoint: [""]
  script:
    - terraform fmt -check
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

plan:
  stage: plan
  image: 
    name: hashicorp/terraform:1.10
    entrypoint: [""]
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - $TF_ROOT/tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

apply:
  stage: apply
  image: 
    name: hashicorp/terraform:1.10
    entrypoint: [""]
  script:
    - terraform apply -auto-approve tfplan
    - echo "CLUSTER_NAME=$(terraform output -raw cluster_name)" >> apply.env
  artifacts:
    reports:
      dotenv: $TF_ROOT/apply.env
  dependencies:
    - plan
  environment:
    name: production
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

install_argocd:
  stage: install-argocd
  image: 
    name: amazon/aws-cli:latest
    entrypoint: [""]
  script:
    - cd $TF_ROOT
    - curl -LO "https://k8s.io(curl -L -s https://k8s.io)/bin/linux/amd64/kubectl" && chmod +x ./kubectl && mv ./kubectl /usr/local/bin/kubectl
    - aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_DEFAULT_REGION
    - kubectl create namespace argocd --dry-name=client -o yaml | kubectl apply -f -
    - kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
    - kubectl apply -f argocd-app.yaml
  needs:
    - job: apply
      artifacts: true
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
