stages:
  - validate
  - plan
  - apply

variables:
  TF_ROOT: k8s-platform
  AWS_DEFAULT_REGION: us-east-1

before_script:
  - cd $TF_ROOT
  - terraform init

validate:
  stage: validate
  image: hashicorp/terraform:1.9
  entrypoint: [""]
  script:
    - terraform fmt -check
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

plan:
  stage: plan
  image: hashicorp/terraform:1.9
  entrypoint: [""]
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - $TF_ROOT/tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

apply:
  stage: apply
  image: hashicorp/terraform:1.9
  entrypoint: [""]
  script:
    - terraform apply -auto-approve tfplan
  dependencies:
    - plan
  environment:
    name: production
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
